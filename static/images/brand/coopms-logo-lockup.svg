<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">COOPMS logo with tagline</title>
  <desc id="desc">COOPMS logo with Digital Cooperative Management Platform tagline.</desc>
  <defs>
